[project]
name = "warehouse-ops"
version = "0.1.0"
description = "Warehouse Ops Agent backend: data model, MCP server, Claude agent, API and evals."
readme = "README.md"
authors = [
    { name = "Scott Peters", email = "scottpeters2281@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "faker>=40.40.0",
    "fastapi>=0.142.2",
    "mcp>=2.2.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[project.scripts]
seed-db = "warehouse_ops.db.seed:main"
warehouse-mcp = "warehouse_ops.mcp_server.server:main"
warehouse-api = "warehouse_ops.api.app:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
